name: Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Documentation/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # The .qmd uses the knitr engine, so the runner needs R.
      # ponytail: only knitr::kable is called at render time, so no renv restore.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr engine
        run: install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Render documentation
        run: quarto render Documentation/fisheries_documentation.qmd --to html

      # Keep the sidecar assets dir: the SWS CSP has no `data:` in style-src, so a
      # self-contained HTML (embed-resources) gets its inlined stylesheets blocked.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp Documentation/fisheries_documentation.html _site/index.html
          cp -r Documentation/fisheries_documentation_files _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
